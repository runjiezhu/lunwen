<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>训练台 · 医学影像训练控制台</title>
<style>
  :root{
    --bg:#0d1117; --panel:#151b23; --panel2:#1b222c; --line:#242c38;
    --text:#e6edf3; --muted:#8b949e; --accent:#4c9aff; --accent2:#3fb950;
    --warn:#d29922; --err:#f85149; --purple:#a371f7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.55 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  a{color:var(--accent)}
  header{display:flex;align-items:center;gap:18px;padding:14px 22px;
    background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
  header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.5px}
  header h1 span{color:var(--accent)}
  .badge{padding:3px 10px;border-radius:20px;font-size:12px;border:1px solid var(--line);
    background:var(--panel2);color:var(--muted);white-space:nowrap}
  .badge.ok{border-color:#1f6f3a;color:var(--accent2);background:#12261a}
  .badge.busy{border-color:#7a5c12;color:var(--warn);background:#2a2210}
  .spacer{flex:1}
  .btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);
    border-radius:6px;padding:7px 14px;cursor:pointer;font-size:13px;transition:.15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:#1f6feb;border-color:#1f6feb;color:#fff;font-weight:600}
  .btn.primary:hover{background:#3b82f6}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .layout{display:grid;grid-template-columns:330px 1fr;gap:18px;padding:18px 22px 40px;
    align-items:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;margin-bottom:18px}
  .card h2{font-size:13px;margin:0 0 14px;text-transform:uppercase;letter-spacing:1px;
    color:var(--muted);font-weight:600}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
  input,select{width:100%;background:#0b0f14;border:1px solid var(--line);color:var(--text);
    border-radius:6px;padding:7px 9px;font-size:13px;font-family:inherit}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;
    margin-bottom:18px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
  .stat .v{font-size:23px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
  .stat .s{font-size:11px;color:var(--muted);margin-top:2px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.6px;
    text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line);
    cursor:pointer;user-select:none;white-space:nowrap}
  th:hover{color:var(--text)}
  td{padding:7px 10px;border-bottom:1px solid #1c232d;font-variant-numeric:tabular-nums}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#1a212b}
  tbody tr.sel{background:#16304f}
  .tag{display:inline-block;padding:1px 7px;border-radius:4px;font-size:11px;
    background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .tag.cls{color:var(--accent)}.tag.multilabel{color:var(--purple)}.tag.reg{color:var(--warn)}
  .bar{height:6px;background:#0b0f14;border-radius:3px;overflow:hidden;min-width:60px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#4c9aff)}
  .bar.low>i{background:linear-gradient(90deg,#9e6a03,#d29922)}
  #log{background:#05080c;border:1px solid var(--line);border-radius:8px;padding:12px 14px;
    height:340px;overflow:auto;font:12px/1.6 Consolas,"Cascadia Mono",monospace;
    white-space:pre-wrap;word-break:break-all}
  #log .e{color:var(--err)}.log .k{color:var(--accent)}
  .job{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);
    border-radius:7px;margin-bottom:7px;background:var(--panel2);cursor:pointer;font-size:12.5px}
  .job:hover{border-color:var(--accent)}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .dot.running{background:var(--warn);animation:pulse 1.1s infinite}
  .dot.done{background:var(--accent2)}.dot.failed{background:var(--err)}
  .dot.stopped,.dot.queued{background:var(--muted)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .job .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .muted{color:var(--muted)}
  .mono{font-family:Consolas,monospace}
  .hint{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5}
  .legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:6px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
  .empty{color:var(--muted);font-size:12.5px;padding:24px 0;text-align:center}
  .tooltip{position:fixed;pointer-events:none;background:#0b0f14;border:1px solid var(--accent);
    border-radius:6px;padding:6px 9px;font-size:11.5px;display:none;z-index:50;max-width:260px}
</style>
</head>
<body>
<header>
  <h1>医学影像<span>训练台</span></h1>
  <div id="gpu" class="badge">GPU 检测中…</div>
  <div id="running" class="badge" style="display:none">空闲</div>
  <div class="spacer"></div>
  <span id="stamp" class="badge mono">—</span>
  <button class="btn" id="refresh">刷新</button>
</header>

<div class="layout">
  <!-- ============ 侧栏 ============ -->
  <div>
    <div class="card">
      <h2>启动训练</h2>
      <label>数据集</label>
      <select id="task"><option value="">加载中…</option></select>
      <div id="taskinfo" class="hint"></div>
      <div class="row">
        <div><label>轮数 epochs</label><input id="epochs" type="number" value="30" min="1" max="500"></div>
        <div><label>批大小 batch</label><input id="bs" type="number" value="64" min="1" max="512"></div>
      </div>
      <div class="row">
        <div><label>学习率 lr</label><input id="lr" type="number" step="0.0001" value="0.001"></div>
        <div><label>随机种子 seed</label><input id="seed" type="number" value="42"></div>
      </div>
      <div class="row">
        <div><label>迭代数 iters（0=按轮数）</label><input id="iters" type="number" value="0" min="0" max="1000000"></div>
      </div>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button class="btn primary" id="start" style="flex:1">开始训练</button>
        <button class="btn" id="stop" disabled>停止</button>
      </div>
      <label style="display:flex;align-items:center;gap:7px;margin-top:10px;cursor:pointer">
        <input id="ovw" type="checkbox" style="width:auto">
        <span>覆盖已有结果（原结果自动备份为 *.prev）</span>
      </label>
      <label style="display:flex;align-items:center;gap:7px;margin-top:6px;cursor:pointer">
        <input id="resume" type="checkbox" style="width:auto">
        <span>继续上次训练（从 last.pt 断点续跑，累加预算而非覆盖）</span>
      </label>
      <div id="msg" class="hint"></div>
    </div>

    <div class="card">
      <h2>任务队列</h2>
      <div id="jobs"><div class="empty">暂无任务</div></div>
    </div>
  </div>

  <!-- ============ 主区 ============ -->
  <div>
    <div class="stats" id="stats"></div>

    <div class="card">
      <h2>结果总览</h2>
      <div class="row3" style="margin-bottom:10px">
        <input id="search" placeholder="搜索任务名…" autocomplete="off">
        <select id="ftype"><option value="">全部类型</option><option value="cls">分类 cls</option>
          <option value="multilabel">多标签 multilabel</option><option value="reg">回归 reg</option></select>
        <select id="fsort"><option value="task">按名称</option><option value="test_desc">按测试集降序</option>
          <option value="test_asc">按测试集升序</option></select>
      </div>
      <div style="overflow:auto;max-height:440px">
        <table><thead><tr>
          <th data-k="task">任务</th><th data-k="task_type">类型</th>
          <th data-k="val">验证集</th><th data-k="test">测试集</th>
          <th data-k="epochs">轮数</th><th data-k="best_epoch">最佳轮</th><th>水平</th>
        </tr></thead><tbody id="tbody"></tbody></table>
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <h2 id="dettitle">训练曲线</h2>
        <div id="detail"><div class="empty">选择一个任务查看逐轮曲线</div></div>
      </div>
      <div class="card">
        <h2>实时日志</h2>
        <div id="log"></div>
      </div>
    </div>
  </div>
</div>
<div class="tooltip" id="tip"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let OV=null, CUR=null, JOBS=[], LOGJOB=null, CURSOR=0, SORT={k:'task',dir:1}, SEL=null;
const POLL=setInterval(tick,1500);

async function j(url,opt){const r=await fetch(url,opt);
  return r.json();}

// ---------- 概览 ----------
async function load(){
  OV=await j('/api/overview');
  renderGpu(OV.gpu); renderStats(OV.stats); renderTasks(OV.tasks);
  renderTable(); renderJobs(OV.running||[]);
  $('#stamp').textContent='更新于 '+new Date().toLocaleTimeString('zh-CN');
}
function renderGpu(g){
  const el=$('#gpu');
  if(!g.available){el.className='badge';el.textContent='无 GPU · '+g.reason;return;}
  el.className='badge ok';
  el.innerHTML=`${g.name} · ${g.memory_used}/${g.memory_total} MiB (${g.memory_pct}%) · 利用率 ${g.utilization}% · ${g.temperature}°C`;
}
function renderStats(s){
  const rows=[
    ['已完成任务',s.total,`共 ${s.available} 个数据集可用`],
    ['分类任务',s.cls,`均值 ${s.mean_cls??'—'}`],
    ['最佳分类',s.best_cls??'—','测试集准确率最高'],
    ['运行中',s.running,s.running?'训练进行中':'空闲'],
  ];
  if(OV.merged){
    rows.push(['合并语料',OV.merged.total.toLocaleString(),
      `${OV.merged.n_tasks} 个任务 · ${OV.merged.size}×${OV.merged.size} · ${OV.merged.bytes_gb} GB`]);
  }
  $('#stats').innerHTML=rows.map(r=>`<div class="stat"><div class="k">${r[0]}</div>
    <div class="v">${r[1]??'—'}</div><div class="s">${r[2]??''}</div></div>`).join('');
}
function renderTasks(tasks){
  const sel=$('#task'), keep=sel.value;
  const opt=['<option value="">选择一个数据集…</option>'];
  for(const [n,t] of Object.entries(tasks)){
    if(!t.has_data) continue;
    opt.push(`<option value="${n}">${n}${t.task_type?' · '+t.task_type:''}</option>`);
  }
  sel.innerHTML=opt.join(''); if(keep) sel.value=keep;
  sel.onchange=()=>{
    const t=tasks[sel.value]; if(!t) return;
    $('#epochs').value=t.default_epochs; $('#bs').value=t.default_batch_size;
    $('#lr').value=t.default_lr;
    $('#taskinfo').textContent=`${t.source||''} · 输出 ${t.num_outputs} · ${t.is_3d?'3D 体数据':'2D 图像'} · ${t.size_mb} MB`;
  };
  if(sel.value) sel.onchange();
}
function renderTable(){
  const q=$('#search').value.trim().toLowerCase(), ft=$('#ftype').value;
  let rows=(OV?.results||[]).filter(r=>
    (!q||r.task.toLowerCase().includes(q))&&(!ft||r.task_type===ft));
  const k=SORT.k, dir=SORT.dir;
  rows.sort((a,b)=>{
    let x=a[k],y=b[k];
    if(typeof x==='number'&&typeof y==='number') return (x-y)*dir;
    return String(x??'').localeCompare(String(y??''))*dir;
  });
  $('#tbody').innerHTML=rows.map(r=>{
    const lower=r.task_type==='reg';
    const pct=Math.max(0,Math.min(100,(r.test??0)*100));
    return `<tr data-t="${r.task}" class="${SEL===r.task?'sel':''}">
      <td>${r.task}</td>
      <td><span class="tag ${r.task_type}">${r.task_type}</span></td>
      <td>${r.val??'—'}</td><td><b>${r.test??'—'}</b></td>
      <td>${r.epochs??'—'}</td><td>${r.best_epoch??'—'}</td>
      <td><div class="bar ${lower?'low':''}"><i style="width:${pct}%"></i></div></td></tr>`;
  }).join('')||'<tr><td colspan="7"><div class="empty">无匹配结果</div></td></tr>';
  $$('#tbody tr[data-t]').forEach(tr=>tr.onclick=()=>{
    SEL=tr.dataset.t; renderTable(); loadDetail(SEL);});
}
$$('th[data-k]').forEach(th=>th.onclick=()=>{
  const k=th.dataset.k; SORT.dir=(SORT.k===k)?-SORT.dir:1; SORT.k=k; renderTable();});
$('#search').oninput=renderTable;
$('#ftype').onchange=renderTable;
$('#fsort').onchange=()=>{
  const v=$('#fsort').value;
  if(v==='task'){SORT={k:'task',dir:1};}else{SORT={k:'test',dir:v==='test_desc'?-1:1};}
  renderTable();};

// ---------- 任务详情 ----------
async function loadDetail(name){
  const d=await j('/api/task/'+name);
  $('#dettitle').textContent=`训练曲线 · ${name}`;
  const s=d.summary, h=s.history||[];
  if(!h.length){$('#detail').innerHTML='<div class="empty">无逐轮记录</div>';return;}
  const metric=s.metric_name||'val_ACC';
  const lower=s.task_type==='reg';
  // The merged corpus stores its mean accuracy under a different key.
  const cand=[metric,'val_'+metric,'val_mean_ACC','val_mean_cls_acc'];
  const key=cand.find(k=>h[0][k]!==undefined)||null;
  if(!key){$('#detail').innerHTML='<div class="empty">无逐轮记录</div>';return;}
  $('#detail').innerHTML=
    `<div class="legend"><span><i style="background:#f85149"></i>训练损失</span>
      <span><i style="background:#4c9aff"></i>验证损失</span>
      <span><i style="background:#3fb950"></i>验证 ${metric}</span></div>
     <div id="chart" style="margin-top:8px"></div>
     <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px">
       ${kv('最佳轮次',s.best_epoch)}${kv('最佳验证',fmt(s.best_val))}
       ${kv('测试集',fmt(s.test))}${kv('参数量',(s.params/1e6).toFixed(2)+'M')}</div>`;
  drawChart(h,key,metric,lower);
}
function kv(k,v){return `<div class="stat" style="padding:10px 12px"><div class="k">${k}</div>
  <div class="v" style="font-size:17px">${v}</div></div>`;}
function fmt(v){return typeof v==='number'?v.toFixed(4):'—';}

function drawChart(h,key,metric,lower){
  const W=560,H=230,PL=44,PR=12,PT=12,PB=26;
  const X=i=>PL+(i/(h.length-1||1))*(W-PL-PR);
  const all=h.flatMap(r=>[r.train_loss,r.val_loss,r[key]]).filter(v=>typeof v==='number');
  let lo=Math.min(...all),hi=Math.max(...all);
  if(hi-lo<1e-9){hi=lo+1;}
  const pad=(hi-lo)*.12; lo-=pad; hi+=pad;
  const Y=v=>PT+(1-(v-lo)/(hi-lo))*(H-PT-PB);
  const path=k=>h.map((r,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(r[k]).toFixed(1)}`).join(' ');
  let ticks='';
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);
    ticks+=`<line x1="${PL}" y1="${y}" x2="${W-PR}" y2="${y}" stroke="#242c38"/>
      <text x="${PL-6}" y="${y+3.5}" fill="#8b949e" font-size="10" text-anchor="end">${v.toFixed(3)}</text>`;}
  let xt='';
  const step=Math.max(1,Math.ceil(h.length/8));
  h.forEach((r,i)=>{if(i%step===0||i===h.length-1)xt+=
    `<text x="${X(i)}" y="${H-8}" fill="#8b949e" font-size="10" text-anchor="middle">${r.epoch}</text>`;});
  $('#chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${ticks}<text x="10" y="${PT+8}" fill="#8b949e" font-size="10">${lower?'↓优':'↑优'}</text>
    <path d="${path('train_loss')}" fill="none" stroke="#f85149" stroke-width="1.6"/>
    <path d="${path('val_loss')}" fill="none" stroke="#4c9aff" stroke-width="1.6"/>
    <path d="${path(key)}" fill="none" stroke="#3fb950" stroke-width="1.8"
      stroke-dasharray="4 3"/>
    ${h.map((r,i)=>`<circle cx="${X(i)}" cy="${Y(r[key])}" r="2.6" fill="#3fb950"
      data-i="${i}"/>`).join('')}
    <text x="${W-PR}" y="${H-8}" fill="#8b949e" font-size="10" text-anchor="end">epoch</text>
    ${xt}</svg>`;
  const tip=$('#tip');
  $$('#chart circle').forEach(c=>{
    c.onmouseenter=e=>{const r=h[c.dataset.i];
      tip.innerHTML=`epoch ${r.epoch}<br>train_loss ${r.train_loss.toFixed(4)}<br>
        val_loss ${r.val_loss.toFixed(4)}<br>${metric} ${r[key].toFixed(4)}<br>
        ${r.secs}s · lr ${(r.lr??0).toExponential(2)}`;
      tip.style.display='block';};
    c.onmousemove=e=>{tip.style.left=Math.min(e.clientX+12,innerWidth-200)+'px';
      tip.style.top=(e.clientY+12)+'px';};
    c.onmouseleave=()=>tip.style.display='none';});
}

// ---------- 任务队列 ----------
async function renderJobs(list){
  JOBS=await j('/api/jobs').then(r=>r.jobs);
  const el=$('#jobs');
  if(!JOBS.length){el.innerHTML='<div class="empty">暂无任务</div>';return;}
  el.innerHTML=JOBS.map(j=>`<div class="job" data-id="${j.id}">
    <span class="dot ${j.status}"></span>
    <span class="nm">${j.task}</span>
    <span class="muted mono">${j.elapsed}s</span></div>`).join('');
  $$('#jobs .job').forEach(d=>d.onclick=()=>{
    LOGJOB=d.dataset.id;CURSOR=0;$('#log').textContent='';});
  const running=JOBS.filter(j=>j.status==='running');
  const rb=$('#running');
  if(running.length){rb.style.display='';rb.className='badge busy';
    rb.textContent=`运行中: ${running.map(r=>r.task).join(', ')}`;}
  else{rb.className='badge';rb.textContent='空闲';}
  $('#stop').disabled=!running.length;
}
$('#start').onclick=async()=>{
  const task=$('#task').value;
  if(!task){msg('请先选择数据集','err');return;}
  const body={task,epochs:+$('#epochs').value,batch_size:+$('#bs').value,
    lr:+$('#lr').value,seed:+$('#seed').value,overwrite:$('#ovw').checked,
    iters:+$('#iters').value,resume:$('#resume').checked};
  let r=await j('/api/train',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)});
  if(r.needs_overwrite){
    if(!confirm(r.error+'\n\n继续将被覆盖的旧结果会被备份为 .prev 文件。是否继续？')) return;
    body.overwrite=true;
    r=await j('/api/train',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)});
  }
  if(r.error){msg(r.error,'err');return;}
  msg('已启动 '+task,'ok'); LOGJOB=r.job.id;CURSOR=0;$('#log').textContent='';
  await load();
};
$('#stop').onclick=async()=>{
  const running=JOBS.filter(j=>j.status==='running');
  for(const j of running) await j2(`/api/jobs/${j.id}/stop`,{});
  msg('已请求停止','ok');
};
async function j2(url,body){const r=await fetch(url,{method:'POST',
  headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return r.json();}
function msg(t,k){$('#msg').textContent=t;$('#msg').style.color=
  k==='err'?'var(--err)':k==='ok'?'var(--accent2)':'var(--muted)';}

// ---------- 日志轮询 ----------
async function tick(){
  try{
    const jobs=(await j('/api/jobs')).jobs;
    const running=jobs.find(x=>x.status==='running')||jobs[0];
    if(!LOGJOB&&running) LOGJOB=running.id;
    if(LOGJOB){
      const d=await j(`/api/jobs/${LOGJOB}/log?since=${CURSOR}`);
      CURSOR=d.cursor;
      if(d.lines.length){
        const box=$('#log');
        const atBottom=box.scrollTop+box.clientHeight>=box.scrollHeight-30;
        box.innerHTML+=d.lines.map(l=>
          `<div class="${/error|traceback|failed|exception/i.test(l)?'e':''}">${esc(l)}</div>`).join('');
        if(atBottom) box.scrollTop=box.scrollHeight;
      }
      if(d.job&&['done','failed','stopped'].includes(d.job.status)&&d.job.ended){
        const box=$('#log');
        box.innerHTML+=`<div class="muted">— 任务 ${d.job.status} · 退出码 ${d.job.exit_code} · 用时 ${d.job.elapsed}s —</div>`;
        LOGJOB=null; load();
      }
    }
    const sig=jobs.map(x=>x.id+x.status).join('|');
    if(sig!==window._sig){window._sig=sig;await load();}
  }catch(e){}
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

$('#refresh').onclick=load;
load();
</script>
</body>
